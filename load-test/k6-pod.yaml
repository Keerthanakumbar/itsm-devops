apiVersion: v1
kind: Pod
metadata:
  name: k6
  namespace: crud
  labels:
    app: k6
spec:
  restartPolicy: Never
  containers:
    - name: k6
      image: grafana/k6:latest
      command: ["sh", "-c", "k6 run /scripts/load-test.js; sleep 600"]
      env:
        - name: K6_WEB_DASHBOARD
          value: "true"
        - name: K6_WEB_DASHBOARD_EXPORT
          value: /tmp/report.html
      volumeMounts:
        - name: script
          mountPath: /scripts
  volumes:
    - name: script
      configMap:
        name: k6-script